services:
  # -----------------------------------------------------------------------
  # APPLICATION SERVICE
  # -----------------------------------------------------------------------
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    env_file:
      - .env

    networks:
      - notification-network
      - shared-network
    restart: on-failure
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8084/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      
  # -----------------------------------------------------------------------
  # MAILHOG (SMTP TESTING)
  # -----------------------------------------------------------------------
  notification-mailhog:
    container_name: notification-mailhog
    networks:
      - notification-network
    image: mailhog/mailhog
    ports:
      - "1026:1025"  # SMTP port
      - "8026:8025"  # Web UI untuk lihat email


networks:
  notification-network:
    name: notification-network
    driver: bridge
  shared-network:
    external: true