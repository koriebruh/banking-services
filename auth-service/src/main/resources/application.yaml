server:
  port: 8081
  netty:
    connection-timeout: 10s
    idle-timeout: 60s

spring:
  application:
    name: auth-service
  config:
    import: "optional:configtree:/run/secrets/"

  jackson:
    property-naming-strategy: SNAKE_CASE

  mail:
    host: localhost
    port: 1025
    #    USAGE FOR PRODUCTION (e.g., Gmail SMTP):
    #    username: your_email@gmail.com
    #    password: your_app_password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: korie123
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  flyway:
    url: jdbc:postgresql://localhost:5432/auth_db
    user: auth_user
    password: korie123
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true
    repair-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password: korie123
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 1000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 1
        enable.idempotence: true

logging:
  level:
    root: WARN
    com.koriebruh.authservice: INFO
    org.springframework: WARN
    io.r2dbc: WARN

# ---------------------------------------------------
# CUSTOM CONFIGURATION
# ---------------------------------------------------
app:
  # SECURITY CONFIGURATION
  jwt:
    private-key: classpath:keys/private_pkcs8.pem
    public-key: classpath:keys/public.pem
    mfa-token-expiration: 300000        # 5 minutes (5 * 60 * 1000)
    access-token-expiration: 900000     # 15 minutes (15 * 60 * 1000)
    refresh-token-expiration: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)
  version: v1

  # CUSTOM
  kafka:
    topic:
      auth-events: auth.events
    event:
      version: v1

  # RATE LIMITING CONFIGURATION FOR AUTHENTICATION ENDPOINTS
  rate-limit:
    endpoints:
      login:
        max-requests: 5
        window-seconds: 60
      register:
        max-requests: 3
        window-seconds: 3600
      verify-email:
        max-requests: 5
        window-seconds: 60
      resend-verification:
        max-requests: 3
        window-seconds: 3600
      forgot-password:
        max-requests: 3
        window-seconds: 3600
      reset-password:
        max-requests: 5
        window-seconds: 60
      mfa-validate:
        max-requests: 5
        window-seconds: 60
      refresh:
        max-requests: 10
        window-seconds: 60

# CONFIGURATION FOR SPRINGDOC OPENAPI (SWAGGER) DOCUMENTATION
springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: true


# ---------------------------------------------------
# MANAGEMENT & OBSERVABILITY
# ---------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

  # Tracing (New Spring 4 Namespace)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/traces"

  # Metrics (Micrometer OTLP Namespace)
  otlp:
    metrics:
      export:
        url: "http://localhost:4318/v1/metrics"

  tracing:
    sampling:
      probability: 1.0

# ---------------------------------------------------
# SERVICE DISCOVERY CONFIGURATION (EUREKA CLIENT)
# ---------------------------------------------------
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-1:8761/eureka/,http://eureka-2:8762/eureka/}
    # Aggressively fetch registry biar tau service lain cepet
    fetch-registry: true
    register-with-eureka: true
    # Seberapa sering pull registry update dari server (default 30s, turunin buat faster discovery)
    registry-fetch-interval-seconds: 10
    # Retry awal koneksi ke Eureka server waktu startup
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 8
    # Jumlah retry kalau Eureka server down waktu startup
    eureka-server-total-connections: 200
    eureka-server-total-connections-per-host: 50
    # Health check aktif — Eureka tau instance beneran sehat atau tidak
    healthcheck:
      enabled: true

  instance:
    # Pakai IP bukan hostname — penting di containerized/Docker environment
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    # Seberapa sering kirim heartbeat ke Eureka (default 30s)
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Metadata tambahan — berguna buat routing dan canary deployment
    metadata-map:
      version: ${APP_VERSION:1.0.0}
      zone: ${AVAILABILITY_ZONE:default}
      environment: ${SPRING_PROFILES_ACTIVE:development}