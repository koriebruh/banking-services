# ============================================================================
# INTEGRATION TEST CONFIGURATION
# ============================================================================
# This configuration is used for integration tests with TestContainers.
# All sensitive values are overridden by DynamicPropertySource in BaseIntegrationTest.
# ============================================================================

spring:
  application:
    name: auth-service-test

  # Database - will be overridden by TestContainers
  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: test
    password: test

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/test_db
    username: test
    password: test

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false  # Allow clean in test environment

  # Redis - will be overridden by TestContainers
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka - will be overridden by TestContainers
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: auth-service-test

  # Mail - mock for tests
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# JWT Configuration for tests
app:
  jwt:
    private-key: classpath:keys/private_pkcs8.pem
    public-key: classpath:keys/public.pem
    access-token-expiration: 900000    # 15 minutes
    refresh-token-expiration: 604800000 # 7 days
    mfa-token-expiration: 300000       # 5 minutes
  version: v1

  # Rate limiting for tests
  rate-limit:
    endpoints:
      login:
        max-requests: 5
        window-seconds: 60
      register:
        max-requests: 3
        window-seconds: 3600
      verify-email:
        max-requests: 5
        window-seconds: 60
      resend-verification:
        max-requests: 3
        window-seconds: 3600
      forgot-password:
        max-requests: 3
        window-seconds: 3600
      reset-password:
        max-requests: 5
        window-seconds: 60
      mfa-validate:
        max-requests: 5
        window-seconds: 60
      refresh:
        max-requests: 10
        window-seconds: 60

# Logging
logging:
  level:
    com.koriebruh.authservice: DEBUG
    org.springframework.r2dbc: DEBUG
    org.testcontainers: INFO
    org.flywaydb: INFO

