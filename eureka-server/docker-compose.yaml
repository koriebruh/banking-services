services:
  eureka-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka-1
    restart: unless-stopped
    ports:
      - "8761:8761"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=eureka-1
      - EUREKA_USERNAME=${EUREKA_USERNAME:-admin}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-admin123}
    networks:
      - eureka-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  eureka-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka-2
    restart: unless-stopped
    ports:
      - "8762:8762"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=eureka-2
      - EUREKA_USERNAME=${EUREKA_USERNAME:-admin}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-admin123}
    networks:
      - eureka-net
    depends_on:
      eureka-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8762/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  eureka-net:
    driver: bridge