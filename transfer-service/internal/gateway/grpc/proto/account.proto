syntax = "proto3";

package account;

option go_package = "golang-clean-architecture/internal/gateway/grpc/pb";

service AccountGrpcService {
  rpc ValidateAccount (ValidateAccountRequest) returns (ValidateAccountResponse);
  rpc GetAccountDetail (GetAccountDetailRequest) returns (AccountDetailResponse);
}

message ValidateAccountRequest {
  string account_number = 1;
  string amount         = 2;
  string currency       = 3;
}

message ValidateAccountResponse {
  bool   valid           = 1;
  string reason          = 2;
  string account_id      = 3;
  string current_balance = 4;
}

message GetAccountDetailRequest {
  string account_number = 1;
}

message AccountDetailResponse {
  string account_id     = 1;
  string account_number = 2;
  string user_id        = 3;
  string account_type   = 4;
  string status         = 5;
  string balance        = 6;
  string currency       = 7;
}