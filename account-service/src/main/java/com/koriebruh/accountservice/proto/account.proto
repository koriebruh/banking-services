syntax = "proto3";

package account;

option java_package = "com.koriebruh.accountservice.grpc";
option java_outer_classname = "AccountProto";
option java_multiple_files = true;

// =============================================================================
// AccountGrpcService
//
// Internal gRPC interface exposed by account-service.
// Consumed exclusively by transfer-service — never called directly by clients.
//
// All methods are unary (request-response).
// Reactive stub (reactor-grpc) is used on both sides to keep the stack
// non-blocking end-to-end.
// =============================================================================
service AccountGrpcService {

  // Validates that an account exists and is ACTIVE.
  // Called by transfer-service before initiating a transfer.
  rpc GetAccountByNumber (GetAccountByNumberRequest) returns (GetAccountByNumberResponse);

  // Returns the current balance of an account.
  // Called by transfer-service to verify sufficient funds before debit.
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);

  // Deducts the given amount from an account balance.
  // Writes an DEBIT record to account_transaction.
  // Idempotent — duplicate reference_id returns the existing result without re-applying.
  rpc Debit (DebitRequest) returns (MutationResponse);

  // Adds the given amount to an account balance.
  // Writes a CREDIT record to account_transaction.
  // Idempotent — duplicate reference_id returns the existing result without re-applying.
  rpc Credit (CreditRequest) returns (MutationResponse);
}

// =============================================================================
// Request / Response messages
// =============================================================================

// -----------------------------------------------------------------------------
// GetAccountByNumber
// -----------------------------------------------------------------------------

message GetAccountByNumberRequest {
  string account_number = 1;
}

message GetAccountByNumberResponse {
  string account_number = 1;
  string user_id        = 2;
  string account_type   = 3; // SAVINGS | CURRENT | DEPOSIT | RDN
  string status         = 4; // ACTIVE | FROZEN | CLOSED
  string currency       = 5;
}

// -----------------------------------------------------------------------------
// GetBalance
// -----------------------------------------------------------------------------

message GetBalanceRequest {
  string account_number = 1;
}

message GetBalanceResponse {
  string account_number = 1;
  string balance        = 2; // String to preserve NUMERIC(19,4) precision — parse as BigDecimal
  string currency       = 3;
}

// -----------------------------------------------------------------------------
// Debit
// -----------------------------------------------------------------------------

message DebitRequest {
  string account_number = 1;
  string amount         = 2; // String to preserve NUMERIC(19,4) precision
  string reference_id   = 3; // Idempotency key — generated by transfer-service (e.g. TRF-20260308-000001)
  string description    = 4;
}

// -----------------------------------------------------------------------------
// Credit
// -----------------------------------------------------------------------------

message CreditRequest {
  string account_number = 1;
  string amount         = 2; // String to preserve NUMERIC(19,4) precision
  string reference_id   = 3; // Idempotency key — must match the reference_id of the paired Debit
  string description    = 4;
}

// -----------------------------------------------------------------------------
// MutationResponse — shared by Debit and Credit
// -----------------------------------------------------------------------------

message MutationResponse {
  bool   success        = 1;
  string account_number = 2;
  string balance_before = 3;
  string balance_after  = 4;
  string reference_id   = 5;
  string message        = 6; // Human-readable result, e.g. "Debit applied" or "Already processed"
}

// =============================================================================
// Error handling
//
// gRPC status codes used by this service:
//   OK (0)              — success
//   NOT_FOUND (5)       — account_number does not exist
//   FAILED_PRECONDITION (9) — account is FROZEN or CLOSED, or insufficient balance
//   ALREADY_EXISTS (6)  — reference_id already processed (idempotency hit)
//   INTERNAL (13)       — unexpected server error
// =============================================================================
